<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | System Error</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Courier New", monospace;
}

body {
    height: 100vh;
    background:
    radial-gradient(circle, #1e293b, #020617);

    display: flex;
    justify-content: center;
    align-items: center;

    color: #38bdf8;
    overflow: hidden;
}


.container {

    text-align: center;
    width: 90%;
    max-width: 700px;

}


.glitch {

    font-size: 150px;
    font-weight: bold;

    color: #38bdf8;

    position: relative;

    animation: glitch 1s infinite;

}



.glitch::before,
.glitch::after {

    content: "404";

    position: absolute;

    left: 0;
    width: 100%;

}


.glitch::before {

    color: #f43f5e;
    animation: glitchTop 1s infinite;

}


.glitch::after {

    color: #22c55e;
    animation: glitchBottom 1s infinite;

}



@keyframes glitch {

    0%,100% {
        transform: none;
    }

    20% {
        transform: skew(5deg);
    }

    40% {
        transform: skew(-5deg);
    }

}



@keyframes glitchTop {

    0%,100% {
        transform:none;
    }

    50% {

        transform:
        translate(-5px,-5px);

    }

}



@keyframes glitchBottom {

    0%,100% {
        transform:none;
    }

    50% {

        transform:
        translate(5px,5px);

    }

}



h1 {

    font-size: 35px;

    margin: 20px;

    color:white;

}



.terminal {

    background:#020617;

    border:1px solid #334155;

    padding:25px;

    border-radius:15px;

    text-align:left;

    color:#22c55e;

    box-shadow:
    0 0 30px rgba(56,189,248,.3);

}



.cursor {

    animation: blink 1s infinite;

}



@keyframes blink {

    50% {
        opacity:0;
    }

}



p {

    color:#cbd5e1;

    margin:25px;

    font-size:18px;

}



a {

    display:inline-block;

    margin-top:20px;

    padding:15px 35px;

    border-radius:30px;

    background:#38bdf8;

    color:#020617;

    text-decoration:none;

    font-weight:bold;

}



a:hover {

    background:white;

}



</style>

</head>


<body>


<div class="container">


<div class="glitch">
404
</div>


<h1>
Ceci n'est pas une page
</h1>



<div class="terminal">

<p>
> Searching requested resource...
</p>

<p>
> Error: Page not found
</p>

<p>
> Recovery protocol activated<span class="cursor">_</span>
</p>

</div>



<p>
The server looked everywhere, but this page disappeared.
</p>



<a href="/">
Return to Homepage
</a>



</div>


</body>

</html>
